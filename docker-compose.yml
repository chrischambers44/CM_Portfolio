version: '3.8'

services:
  portfolio:
    build: .
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "5200:5200"
    volumes:
      - ./instance:/app/instance
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - SECRET_KEY=${SECRET_KEY:-chambers-morgan-2026-change-me}
      - DATABASE_URL=sqlite:////app/instance/portfolio.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5200/')"]
      interval: 30s
      timeout: 10s
      retries: 3
