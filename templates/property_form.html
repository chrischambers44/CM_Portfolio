{% extends 'base.html' %}
{% block title %}{{ 'Edit' if prop else 'Add' }} Property{% endblock %}
{% block content %}
<div class="page" style="max-width:700px;">
  <div class="page-header">
    <div>
      {% if prop %}<div class="breadcrumb"><a href="{{ url_for('properties') }}">Properties</a> / <a href="{{ url_for('property_detail', prop_id=prop.id) }}">{{ prop.short_name }}</a> /</div>{% endif %}
      <div class="page-title">{{ 'Edit Property' if prop else 'Add Property' }}</div>
    </div>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-grid-2">
        <div class="form-group">
          <label>Short Name *</label>
          <input type="text" name="short_name" value="{{ prop.short_name if prop else '' }}" required placeholder="e.g. 180 Sherborne">
        </div>
        <div class="form-group">
          <label>Postcode</label>
          <input type="text" name="postcode" value="{{ prop.postcode if prop else '' }}" placeholder="e.g. BA21 4HL">
        </div>
        <div class="form-group form-full">
          <label>Full Address *</label>
          <input type="text" name="address" value="{{ prop.address if prop else '' }}" required placeholder="Street, Town, Postcode">
        </div>
        <div class="form-group">
          <label>Property Type</label>
          <select name="property_type">
            {% for t in ['rental','personal','company'] %}
            <option value="{{ t }}" {% if prop and prop.property_type==t %}selected{% endif %}>{{ t.title() }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Ownership</label>
          <select name="ownership">
            {% for o, label in [('company','Company (C&M Ltd)'),('joint','Joint (Chris & Ash)'),('personal_chris','Personal — Chris'),('personal_ash','Personal — Ash')] %}
            <option value="{{ o }}" {% if prop and prop.ownership==o %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Region</label>
          <select name="region">
            {% for r in ['yeovil','cardiff','liverpool','other'] %}
            <option value="{{ r }}" {% if prop and prop.region==r %}selected{% endif %}>{{ r.title() }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" rows="5" placeholder="Purchase history, tenant notes, access details…">{{ prop.notes if prop else '' }}</textarea>
      </div>
      <div class="flex" style="justify-content:flex-end;gap:.6rem;">
        <a href="{{ url_for('property_detail', prop_id=prop.id) if prop else url_for('properties') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-green">{{ 'Save Changes' if prop else 'Add Property' }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
