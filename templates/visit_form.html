{% extends 'base.html' %}
{% block title %}{{ 'Edit' if visit else 'Log' }} Visit{% endblock %}
{% block content %}
<div class="page" style="max-width:700px;">
  <div class="page-header">
    <div>
      <div class="breadcrumb"><a href="{{ url_for('visits') }}">Visits</a> /</div>
      <div class="page-title">{{ 'Edit Visit' if visit else 'Log Inspection Visit' }}</div>
    </div>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-grid-2">
        <div class="form-group">
          <label>Property *</label>
          <select name="property_id" required>
            <option value="">— Select property —</option>
            {% for p in props %}
            <option value="{{ p.id }}"
              {% if visit and visit.property_id==p.id %}selected
              {% elif request.args.get('property_id')==p.id|string %}selected{% endif %}>
              {{ p.short_name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Visited by</label>
          <select name="visited_by_id">
            <option value="">— Select —</option>
            {% for d in directors %}
            <option value="{{ d.id }}"
              {% if visit and visit.visited_by_id==d.id %}selected{% endif %}>
              {{ d.display_name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Visit Type</label>
          <select name="visit_type">
            {% for vt, label in [('routine','Routine'),('special','Special'),('emergency','Emergency'),('tenant_inspection','Tenant Inspection')] %}
            <option value="{{ vt }}" {% if visit and visit.visit_type==vt %}selected{% elif not visit and vt=='routine' %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Visit Date *</label>
          <input type="date" name="visit_date"
            value="{{ visit.visit_date.isoformat() if visit and visit.visit_date else today.isoformat() }}" required>
        </div>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" rows="6" placeholder="Inspection findings, tasks raised, tenant conversation…">{{ visit.notes if visit else '' }}</textarea>
      </div>
      <div class="form-group">
        <label><input type="checkbox" name="checked" style="width:auto;margin-right:.4rem;"
          {% if visit and visit.checked %}checked{% endif %}> Report checked / verified</label>
      </div>
      <div class="flex" style="justify-content:flex-end;gap:.6rem;">
        <a href="{{ url_for('visits') }}" class="btn btn-ghost">Cancel</a>
        <button type="submit" class="btn btn-green">{{ 'Save Changes' if visit else 'Save Visit' }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
